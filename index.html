
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NOVA Voice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 22px 18px 30px;
            background: #F5F7FA;
            color: #172B3A;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin: 8px 0 26px;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #172B3A;
        }

        .logo span {
            color: #007FFF;
        }

        .subtitle {
            margin-top: 7px;
            color: #718096;
            font-size: 14px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 15px;
            padding: 7px 13px;
            border-radius: 30px;
            background: #EAF0F6;
            color: #64748B;
            font-size: 12px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94A3B8;
        }

        .status.online {
            background: #E7F8ED;
            color: #168044;
        }

        .status.online .status-dot {
            background: #22C55E;
        }

        .status.connected {
            background: #E6F2FF;
            color: #007FFF;
        }

        .status.connected .status-dot {
            background: #007FFF;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 27px 2px 12px;
        }

        .section-heading h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .participant-count {
            color: #718096;
            font-size: 12px;
        }

        .participant-panel {
            background: #FFFFFF;
            border: 1px solid #E8EDF3;
            border-radius: 17px;
            padding: 7px;
            box-shadow: 0 3px 12px rgba(20, 40, 70, 0.035);
            min-height: 120px;
        }

        .participant {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 11px;
            border-radius: 12px;
            transition: background 0.2s ease, border 0.2s ease;
            border: 1px solid transparent;
        }

        .participant + .participant {
            margin-top: 3px;
        }

        .participant.speaking {
            background: #F0F8FF;
            border-color: #B9DCFF;
        }

        .avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E5F1FF;
            color: #007FFF;
            font-size: 16px;
            font-weight: 700;
        }

        .participant-info {
            flex: 1;
            min-width: 0;
        }

        .participant-name {
            font-size: 14px;
            font-weight: 650;
            color: #243447;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .participant-description {
            margin-top: 3px;
            font-size: 11px;
            color: #94A3B8;
        }

        .speaking-indicator {
            display: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22C55E;
        }

        .participant.speaking .speaking-indicator {
            display: block;
        }

        .empty-state {
            padding: 30px 12px;
            text-align: center;
            color: #94A3B8;
            font-size: 13px;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 23px;
            margin: 38px auto 0;
        }

        .control-button {
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .control-button:active {
            transform: scale(0.93);
        }

        .side-button {
            width: 57px;
            height: 57px;
            border-radius: 50%;
            background: #E9EEF4;
            color: #526477;
        }

        .side-button.active {
            background: #DDF7E7;
            color: #168044;
        }

        .side-button.muted {
            background: #FDE5E5;
            color: #DC2626;
        }

        .call-button {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #22C55E;
            color: #FFFFFF;
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.25);
        }

        .call-button.disconnect {
            background: #EF4444;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.22);
        }

        .call-button:disabled,
        .side-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .call-label {
            margin-top: 12px;
            text-align: center;
            color: #64748B;
            font-size: 13px;
            font-weight: 600;
        }

        .controls.hidden {
            display: none;
        }

        .side-button.hidden {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 38px;
            color: #A0AEC0;
            font-size: 11px;
        }

        .footer strong {
            color: #007FFF;
            font-weight: 700;
        }

        .hidden-compatibility {
            display: none !important;
        }

        svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .call-button svg {
            width: 29px;
            height: 29px;
        }
    </style>
</head>

<body>

<div class="container">

    <header class="page-header">
        <div class="logo">NOVA <span>Voice</span></div>
        <div class="subtitle">Intern röstkanal</div>

        <div class="status" id="status">
            <span class="status-dot"></span>
            <span id="statusText">Väntar på anslutning...</span>
        </div>
    </header>

    <div class="section-heading">
        <h3>Deltagare</h3>
        <span class="participant-count" id="participantCount">
            0 anslutna
        </span>
    </div>

    <div class="participant-panel" id="participants">
        <div class="empty-state">
            Hämtar deltagare...
        </div>
    </div>

    <div class="controls" id="controls">

        <!-- Högtalare -->
        <button
            class="control-button side-button hidden"
            id="speakerButton"
            aria-label="Högtalare"
            disabled>

            <svg viewBox="0 0 24 24" id="speakerIcon">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M19 5a10 10 0 0 1 0 14"/>
            </svg>
        </button>

        <!-- Anslut / Koppla från -->
        <button
            class="control-button call-button"
            id="callButton"
            aria-label="Anslut">

            <svg viewBox="0 0 24 24" id="callIcon">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                19.79 19.79 0 0 1-8.63-3.07
                19.5 19.5 0 0 1-6-6
                A19.79 19.79 0 0 1 2.12 4.18
                2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
                c.12.96.35 1.9.7 2.8
                a2 2 0 0 1-.45 2.11L8.09 9.91
                a16 16 0 0 0 6 6l1.27-1.27
                a2 2 0 0 1 2.11-.45
                c.9.35 1.84.58 2.8.7
                A2 2 0 0 1 22 16.92Z"/>
            </svg>
        </button>

        <!-- Mikrofon -->
        <button
            class="control-button side-button hidden"
            id="micButton"
            aria-label="Mikrofon"
            disabled>

            <svg viewBox="0 0 24 24" id="micIcon">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
                <path d="M12 19v3"/>
                <path d="M8 22h8"/>
            </svg>
        </button>

    </div>

    <div class="call-label" id="callLabel">Anslut till röstkanalen</div>

    <div class="footer">
        <strong>NOVA</strong> · Intern kommunikation
    </div>

</div>

<!-- Behålls för MAUI:s befintliga frånkopplingsfunktion -->
<button id="leaveButton" class="hidden-compatibility" type="button">
    Lämna
</button>

<script type="module">

import {
    Room,
    RoomEvent,
    Track
} from "https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/+esm";

const SUPABASE_URL =
    "https://txaoaukewcjlvooqteoc.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_-FIdsU4ubt7NFU1aCIfeEA_9U_A2xhG";

const PARTICIPANTS_FUNCTION =
    SUPABASE_URL + "/functions/v1/get-voice-participants";

const statusElement = document.getElementById("status");
const statusText = document.getElementById("statusText");

const participantsElement =
    document.getElementById("participants");

const participantCount =
    document.getElementById("participantCount");

const callButton = document.getElementById("callButton");
const callIcon = document.getElementById("callIcon");
const callLabel = document.getElementById("callLabel");

const micButton = document.getElementById("micButton");
const micIcon = document.getElementById("micIcon");

const speakerButton = document.getElementById("speakerButton");

const leaveButton = document.getElementById("leaveButton");

let credentials = null;
let room = null;

let connected = false;
let connecting = false;

let micEnabled = true;
let speakerEnabled = false;

let participantRefreshTimer = null;
let participantRequestInProgress = false;

let observerParticipants = [];


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function setStatus(text, type = "") {

    statusText.textContent = text;

    statusElement.className = "status";

    if (type) {
        statusElement.classList.add(type);
    }
}


// --------------------------------------------------
// PARTICIPANT LIST
// --------------------------------------------------

function renderParticipants(list, showSpeaking = false) {

    participantsElement.innerHTML = "";

    participantCount.textContent =
        list.length + (list.length === 1
            ? " ansluten"
            : " anslutna");

    if (!list.length) {

        const empty = document.createElement("div");

        empty.className = "empty-state";
        empty.textContent =
            "Ingen är ansluten till röstkanalen just nu.";

        participantsElement.appendChild(empty);

        return;
    }

    for (const participant of list) {

        const name =
            participant.username ||
            participant.name ||
            participant.identity ||
            "NOVA-användare";

        const item = document.createElement("div");

        item.className = "participant";

        if (showSpeaking && participant.isSpeaking) {
            item.classList.add("speaking");
        }

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            name.trim().charAt(0).toUpperCase() || "?";

        const info = document.createElement("div");

        info.className = "participant-info";

        const nameElement = document.createElement("div");

        nameElement.className = "participant-name";
        nameElement.textContent = name;

        const description = document.createElement("div");

        description.className = "participant-description";

        description.textContent =
            participant.isAdmin === true
                ? "Admin"
                : "User";

        info.appendChild(nameElement);
        info.appendChild(description);

        const indicator = document.createElement("div");

        indicator.className = "speaking-indicator";

        item.appendChild(avatar);
        item.appendChild(info);
        item.appendChild(indicator);

        participantsElement.appendChild(item);
    }
}


// --------------------------------------------------
// HÄMTA DELTAGARE FRÅN SUPABASE
// --------------------------------------------------

async function fetchObserverParticipants() {

    if (!credentials?.accessToken) {
        return;
    }

    if (participantRequestInProgress) {
        return;
    }

    if (connecting) {
        return;
    }

    participantRequestInProgress = true;

    try {

        const response = await fetch(PARTICIPANTS_FUNCTION, {
            method: "POST",

            headers: {
                "Authorization":
                    "Bearer " + credentials.accessToken,

                "apikey": SUPABASE_ANON_KEY,

                "Content-Type": "application/json"
            },

            body: JSON.stringify({})
        });

        if (!response.ok) {

            if (response.status === 401) {
                console.warn(
                    "Supabase-sessionen behöver uppdateras."
                );
            }

            throw new Error(
                "Kunde inte hämta deltagare: " + response.status
            );
        }

        const data = await response.json();

        observerParticipants =
            Array.isArray(data.participants)
                ? data.participants
                : [];

        if (connected) {

            // Uppdatera LiveKit-listan med den nya profilinformationen.
            updateLiveKitParticipants();

        } else if (!connecting) {

            // Visningsläge när användaren inte är ansluten.
            renderParticipants(observerParticipants, false);

            setStatus("Redo att ansluta", "online");
        }

    } catch (error) {

        console.error(
            "Fel vid hämtning av deltagare:",
            error
        );

        if (!observerParticipants.length) {

            participantsElement.innerHTML = `
                <div class="empty-state">
                    Kunde inte hämta deltagarlistan.<br>
                    Försöker igen automatiskt...
                </div>
            `;
        }

    } finally {

        participantRequestInProgress = false;
    }
}


// --------------------------------------------------
// AUTOMATISK UPPDATERING
// --------------------------------------------------

function startParticipantRefresh() {

    stopParticipantRefresh();

    fetchObserverParticipants();

    participantRefreshTimer = setInterval(() => {

        fetchObserverParticipants();

    }, 3000);
}


function stopParticipantRefresh() {

    if (participantRefreshTimer !== null) {

        clearInterval(participantRefreshTimer);

        participantRefreshTimer = null;
    }
}


// --------------------------------------------------
// LIVEKIT-DELTAGARE
// --------------------------------------------------

function updateLiveKitParticipants() {

    if (!room || !connected) {
        return;
    }

    const list = [];

    // Matcha LiveKit-identiteten mot Supabase-profilen.
    function getProfile(identity) {

        return observerParticipants.find(
            participant => participant.identity === identity
        );
    }

    const local = room.localParticipant;

    if (local) {

        const profile = getProfile(local.identity);

        list.push({
            identity: local.identity,

            name:
                profile?.username ||
                profile?.name ||
                local.name ||
                local.identity,

            username: profile?.username || null,

            isAdmin: profile?.isAdmin === true,

            isSpeaking: local.isSpeaking
        });
    }

    for (const participant of room.remoteParticipants.values()) {

        const profile = getProfile(participant.identity);

        list.push({
            identity: participant.identity,

            name:
                profile?.username ||
                profile?.name ||
                participant.name ||
                participant.identity,

            username: profile?.username || null,

            isAdmin: profile?.isAdmin === true,

            isSpeaking: participant.isSpeaking
        });
    }

    renderParticipants(list, true);
}


// --------------------------------------------------
// LJUD
// --------------------------------------------------

function attachAudio(track) {

    if (track.kind !== Track.Kind.Audio) {
        return;
    }

    const audioElement = track.attach();

    audioElement.style.display = "none";

    document.body.appendChild(audioElement);

    audioElement.play().catch(error => {
        console.warn("Kunde inte starta ljuduppspelning:", error);
    });
}


function detachAudio(track) {

    track.detach().forEach(element => {
        element.remove();
    });
}


async function setSpeaker(enabled) {

    speakerEnabled = enabled;

    try {

        if (window.NovaAudio) {

            window.NovaAudio.setSpeakerphone(enabled);
        }

    } catch (error) {

        console.error(
            "Kunde inte ändra högtalare:",
            error
        );
    }

    updateControlButtons();
}


// --------------------------------------------------
// KONTROLLKNAPPAR
// --------------------------------------------------

function updateControlButtons() {

    if (connected) {

        callButton.classList.add("disconnect");

        callButton.setAttribute(
            "aria-label",
            "Koppla från"
        );

        callIcon.innerHTML = `
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2
            19.79 19.79 0 0 1-8.63-3.07
            19.5 19.5 0 0 1-6-6
            A19.79 19.79 0 0 1 2.12 4.18
            2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
            c.12.96.35 1.9.7 2.8
            a2 2 0 0 1-.45 2.11L8.09 9.91
            a16 16 0 0 0 6 6l1.27-1.27
            a2 2 0 0 1 2.11-.45
            c.9.35 1.84.58 2.8.7
            A2 2 0 0 1 22 16.92Z"/>
        `;

        micButton.classList.remove("hidden");
        speakerButton.classList.remove("hidden");

        micButton.disabled = false;
        speakerButton.disabled = false;

        callLabel.textContent = "Koppla från";

        // Mikrofon
        if (micEnabled) {

            micButton.classList.add("active");
            micButton.classList.remove("muted");

            micIcon.innerHTML = `
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
                <path d="M12 19v3"/>
                <path d="M8 22h8"/>
            `;

        } else {

            micButton.classList.remove("active");
            micButton.classList.add("muted");

            micIcon.innerHTML = `
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
                <path d="M12 19v3"/>
                <path d="M8 22h8"/>
                <path d="m3 3 18 18"/>
            `;
        }

        // Högtalare
        if (speakerEnabled) {

            speakerButton.classList.add("active");

        } else {

            speakerButton.classList.remove("active");
        }

    } else {

        callButton.classList.remove("disconnect");

        callButton.setAttribute(
            "aria-label",
            "Anslut"
        );

        callIcon.innerHTML = `
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2
            19.79 19.79 0 0 1-8.63-3.07
            19.5 19.5 0 0 1-6-6
            A19.79 19.79 0 0 1 2.12 4.18
            2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
            c.12.96.35 1.9.7 2.8
            a2 2 0 0 1-.45 2.11L8.09 9.91
            a16 16 0 0 0 6 6l1.27-1.27
            a2 2 0 0 1 2.11-.45
            c.9.35 1.84.58 2.8.7
            A2 2 0 0 1 22 16.92Z"/>
        `;

        micButton.classList.add("hidden");
        speakerButton.classList.add("hidden");

        callLabel.textContent = "Anslut till röstkanalen";
    }
}


// --------------------------------------------------
// ANSLUT TILL LIVEKIT
// --------------------------------------------------

async function connectToVoice() {

    if (!credentials?.token || !credentials?.serverUrl) {

        setStatus(
            "Inloggningsuppgifter saknas",
            ""
        );

        return;
    }

    if (connected || connecting) {
        return;
    }

    connecting = true;

    callButton.disabled = true;

    setStatus("Ansluter...", "");

    stopParticipantRefresh();

    try {

        room = new Room({
            adaptiveStream: true,
            dynacast: true
        });

        room.on(
            RoomEvent.ParticipantConnected,
            updateLiveKitParticipants
        );

        room.on(
            RoomEvent.ParticipantDisconnected,
            updateLiveKitParticipants
        );

        room.on(
            RoomEvent.ActiveSpeakersChanged,
            updateLiveKitParticipants
        );

        room.on(
            RoomEvent.TrackSubscribed,
            (track) => {

                if (track.kind === Track.Kind.Audio) {
                    attachAudio(track);
                }

                updateLiveKitParticipants();
            }
        );

        room.on(
            RoomEvent.TrackUnsubscribed,
            (track) => {

                detachAudio(track);

                updateLiveKitParticipants();
            }
        );

        room.on(
            RoomEvent.Disconnected,
            () => {

                connected = false;
                connecting = false;

                room = null;

                micEnabled = true;
                speakerEnabled = false;

                updateControlButtons();

                setStatus(
                    "Frånkopplad",
                    "online"
                );

                startParticipantRefresh();
            }
        );

        await room.connect(
            credentials.serverUrl,
            credentials.token
        );

        connected = true;

        await room.startAudio();

        await room.localParticipant.setMicrophoneEnabled(true);

        micEnabled = true;

        await setSpeaker(false);

        connecting = false;

        callButton.disabled = false;

        updateControlButtons();

        updateLiveKitParticipants();

        setStatus(
            "Ansluten till NOVA Voice",
            "connected"
        );

        // Fortsätt hämta profilinformation även under samtalet.
        startParticipantRefresh();

    } catch (error) {

        console.error("LiveKit-anslutningsfel:", error);

        connected = false;
        connecting = false;

        if (room) {

            try {
                await room.disconnect();
            } catch (_) {
            }

            room = null;
        }

        callButton.disabled = false;

        updateControlButtons();

        setStatus(
            "Kunde inte ansluta",
            ""
        );

        startParticipantRefresh();
    }
}


// --------------------------------------------------
// KOPPLA FRÅN
// --------------------------------------------------

async function disconnectFromVoice() {

    if (room) {

        const currentRoom = room;

        connected = false;

        try {

            await currentRoom.disconnect();

        } catch (error) {

            console.error(
                "Fel vid frånkoppling:",
                error
            );
        }

        if (room === currentRoom) {
            room = null;
        }
    }

    connected = false;
    connecting = false;

    micEnabled = true;
    speakerEnabled = false;

    updateControlButtons();

    setStatus(
        "Frånkopplad",
        "online"
    );

    startParticipantRefresh();
}


// --------------------------------------------------
// KNAPPAR
// --------------------------------------------------

callButton.addEventListener("click", async () => {

    if (connected) {

        await disconnectFromVoice();

    } else {

        await connectToVoice();
    }
});


leaveButton.addEventListener("click", async () => {

    await disconnectFromVoice();
});


micButton.addEventListener("click", async () => {

    if (!room || !connected) {
        return;
    }

    try {

        micEnabled = !micEnabled;

        await room.localParticipant.setMicrophoneEnabled(
            micEnabled
        );

        updateControlButtons();

    } catch (error) {

        console.error(
            "Kunde inte ändra mikrofon:",
            error
        );

        micEnabled = !micEnabled;

        updateControlButtons();
    }
});


speakerButton.addEventListener("click", async () => {

    if (!connected) {
        return;
    }

    await setSpeaker(!speakerEnabled);
});


// --------------------------------------------------
// MAUI-BRYGGA
// --------------------------------------------------

window.NOVA = window.NOVA || {};

window.NOVA.receiveCredentials = function(data) {

    try {

        if (typeof data === "string") {
            data = JSON.parse(data);
        }

        credentials = data;

        if (!credentials?.token ||
            !credentials?.serverUrl ||
            !credentials?.accessToken) {

            setStatus(
                "Kunde inte läsa inloggningsuppgifter",
                ""
            );

            return;
        }

        setStatus(
            "Redo att ansluta",
            "online"
        );

        startParticipantRefresh();

    } catch (error) {

        console.error(
            "Fel vid mottagning av inloggningsuppgifter:",
            error
        );

        setStatus(
            "Ett fel uppstod",
            ""
        );
    }
};


// --------------------------------------------------
// START
// --------------------------------------------------

updateControlButtons();

</script>

</body>
</html>
